version: '3.8'

services:
  # Echo server (main API)
  echo-server:
    build:
      context: .
      dockerfile: Dockerfile.echo
    container_name: mi-bolsillo-echo-server
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_TOKEN=${DATABASE_TOKEN}
      - EMAIL_PROVIDER_URL=${EMAIL_PROVIDER_URL}
      - EMAIL_PROVIDER_TOKEN=${EMAIL_PROVIDER_TOKEN}
      - CLERK_JWKS_URL=${CLERK_JWKS_URL}
      - GROK_API_KEY=${GROK_API_KEY}
      - OTP_EXPIRATION_MINUTES=${OTP_EXPIRATION_MINUTES:-5}
    restart: unless-stopped
    networks:
      - mi-bolsillo-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Telegram bot
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.telegram
    container_name: mi-bolsillo-telegram-bot
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_TOKEN=${DATABASE_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - CLERK_JWKS_URL=${CLERK_JWKS_URL}
      - GROK_API_KEY=${GROK_API_KEY}
    restart: unless-stopped
    networks:
      - mi-bolsillo-network
    depends_on:
      echo-server:
        condition: service_healthy

networks:
  mi-bolsillo-network:
    driver: bridge
