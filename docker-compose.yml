version: '3.8'

services:
  # Echo server (main API)
  echo-server:
    build:
      context: ./mi-bolsillo-api
      dockerfile: Dockerfile.echo
    container_name: mi-bolsillo-echo-server
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_TOKEN=${DATABASE_TOKEN}
      - EMAIL_PROVIDER_URL=${EMAIL_PROVIDER_URL}
      - EMAIL_PROVIDER_TOKEN=${EMAIL_PROVIDER_TOKEN}
      - CLERK_JWKS_URL=${CLERK_JWKS_URL}
      - GROK_API_KEY=${GROK_API_KEY}
      - OTP_EXPIRATION_MINUTES=${OTP_EXPIRATION_MINUTES:-5}
    restart: unless-stopped
    networks:
      - mi-bolsillo-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Telegram bot
  telegram-bot:
    build:
      context: ./mi-bolsillo-api
      dockerfile: Dockerfile.telegram
    container_name: mi-bolsillo-telegram-bot
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_TOKEN=${DATABASE_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - CLERK_JWKS_URL=${CLERK_JWKS_URL}
      - GROK_API_KEY=${GROK_API_KEY}
    restart: unless-stopped
    networks:
      - mi-bolsillo-network
    depends_on:
      echo-server:
        condition: service_healthy

  # Frontend application
  frontend:
    build:
      context: ./mi-bolsillo-front
      dockerfile: Dockerfile
      args:
        - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
        - VITE_TELEGRAM_BOT_USERNAME=${VITE_TELEGRAM_BOT_USERNAME}
    container_name: mi-bolsillo-frontend
    ports:
      - "3000:80"
    environment:
      - PORT=80
      - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
      - VITE_TELEGRAM_BOT_USERNAME=${VITE_TELEGRAM_BOT_USERNAME}
    restart: unless-stopped
    networks:
      - mi-bolsillo-network
    depends_on:
      echo-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  mi-bolsillo-network:
    driver: bridge
